# conda env create -f environment.yaml
name: megsite
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip
  - numpy=1.24.4
  - scipy
  - pandas
  - tqdm
  - scikit-learn
  - pytorch=2.5.1
  - pytorch-cuda=12.1
  - hydra-core=1.3.2
  - pip:
      - torch-geometric>=2.6,<2.7
      - easydict
      - transformers==4.37.1
      - fair-esm==2.0.0
      - tokenizers==0.15.1
      - sentencepiece==0.2.0
      - accelerate==0.26.1
      - safetensors==0.4.2
